<h1 class="font-headline text-5xl md:text-6xl font-light tracking-tighter text-on-surface">

</div>
<!-- Form Section -->
<form class="space-y-12" action="/submit-sign-in" method="POST">
<div class="space-y-10">

<div class="relative group">
<label class="block text-[10px] tracking-[0.2em] uppercase text-outline mb-2 font-medium" for="email">Email Address</label>

<!-- Password Field -->
<div class="relative group">
<div class="flex justify-between items-end mb-2">
<label class="block text-[10px] tracking-[0.2em] uppercase text-outline font-medium" for="password">Password</label>
<a class="text-[9px] tracking-widest uppercase text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password</a>
</div>
<input name="password" class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 transition-colors duration-500 font-body text-lg placeholder-stone-300" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>

<div class="flex-grow h-px bg-surface-container"></div>

<div class="flex-grow h-px bg-surface-container"></div>

<span class="text-[11px] tracking-widest uppercase font-medium">Access with Google</span>

<script>
    // Check for error params
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
        const errorContainer = document.getElementById('errorContainer');
        const error = params.get('error');
        let errorMsg = 'An error occurred during authentication';
        
        if (error === 'auth_failed') {
            errorMsg = 'Authentication failed. Please try again.';
        } else if (error === 'oauth_error') {
            errorMsg = 'OAuth error. Please check your credentials.';
        }
        
        errorContainer.innerHTML = `<div class="error">${errorMsg}</div>`;
    }
</script>
