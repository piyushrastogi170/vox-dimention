            backdrop-filter: blur(40px);

        }
        .signature-spotlight {
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.05) 0%, transparent 70%);

<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar -->
{% include 'components/header.html' %}
<main class="relative min-h-screen pt-32 pb-24 px-6 overflow-hidden signature-spotlight flex items-center justify-center">
<!-- Background Architectural Elements -->
<div class="absolute top-0 right-0 w-1/3 h-full bg-surface-container-low -z-10 translate-x-1/2 opacity-50"></div>
<div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-surface-container-low -z-10 -translate-x-1/4 translate-y-1/4 rotate-12 opacity-30"></div>
<div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 bg-white shadow-2xl relative">
<!-- Left Side: Visual/Editorial -->
<div class="hidden lg:block relative overflow-hidden bg-stone-900">
<img alt="Architectural abstraction" class="absolute inset-0 w-full h-full object-cover opacity-60" data-alt="Monochromatic architectural detail of a sweeping curved staircase in a luxury gallery, soft directional light creating dramatic shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWJuOOPzWbhJ8t07un23bv9CTjuqZy--kKZgwZlu3xWLMk_UuCyr6mi8GIiOFSMbbbGynLDFbUJkyNIpBk0V08_6VcOKeKHePkHQrx2gQr6iD4RlwdaNMoLPHROVqfWCWAkR9DYV-qTxmiVeEMZb2lzxUnssxNmVbgXGrA1HaI2Cwwq9JNTfduiTDcNswH6I9J3L1I-v2m17HYBPv6E02RtlFSWKYzOIa7-jwIbphWLz34p4GpN-6r_Rtx-TW-vd4PIarDHnzM0Sg"/>
<div class="absolute inset-0 p-16 flex flex-col justify-end">
<div class="w-12 h-[1px] bg-primary-container mb-8"></div>
<h2 class="font-headline text-5xl text-white leading-tight mb-6 tracking-tighter">Voice as <br/>Architecture.</h2>
<p class="text-stone-300 font-light leading-relaxed max-w-xs">Enter a domain where sound is sculpted with the precision of a master artisan.</p>
</div>
</div>
<!-- Right Side: Form -->
<div class="p-8 md:p-16 lg:p-20 flex flex-col justify-center">
<div class="mb-12">
<h1 class="font-headline text-4xl text-on-surface tracking-tighter mb-4">Create Your Account</h1>
<p class="text-secondary font-light tracking-wide text-sm">Join the architectural frontier of AI voice</p>
</div>
<form class="space-y-10" action="/submit-sign-up" method="POST">
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Full Name</label>
<input name="name" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all" placeholder="Elias Thorne" type="text"/>
</div>
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Email Address</label>
<input name="email" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all" placeholder="atelier@voxdimension.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Mobile Number</label>
<input name="mobile" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Country</label>
<select name="country" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all appearance-none">
    <option value="india">India</option>
    <option value="france">France</option>
    <option value="singapore">Singapore</option>
    <option value="united state">United States</option>
    <option value="united kingdon">United Kingdom</option>
    <option value="united arab emirates">United Arab Emirates</option>
</select>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Create Password</label>
<input name="create_pass" minlength="8" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-2">Confirm Password</label>
<input name="password" minlength="8" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 focus:ring-0 text-on-surface font-light transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-headline uppercase tracking-widest text-xs py-5 hover:bg-surface-tint transition-all duration-500 shadow-xl shadow-primary/10" type="submit">
                            Create Account
                        </button>
</div>
</form>
<script id="x7d2n9">
        document.querySelector("form").addEventListener("submit", function(e) {
            const pass = document.querySelector('input[name="create_pass"]').value;
            const confirm = document.querySelector('input[name="password"]').value;
        
            if (pass !== confirm) {
                e.preventDefault();
                alert("Passwords do not match!");
            }
        });
        </script>
<div class="mt-12 flex items-center gap-4">
<div class="flex-grow h-[1px] bg-stone-100"></div>
<span class="text-[10px] uppercase tracking-[0.3em] text-stone-400">Or sign up with</span>
<div class="flex-grow h-[1px] bg-stone-100"></div>
</div>
<div class="mt-8">
    <a href="/login">
<button class="w-full border border-stone-200 py-4 flex items-center justify-center gap-3 hover:bg-stone-50 transition-colors duration-300">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label text-xs uppercase tracking-widest text-on-surface">Continue with Google</span>
</button>
</a>
</div>
<div class="mt-12 text-center">
<p class="text-stone-400 font-light text-xs">
                        Already have an account? 
                        <a class="text-primary font-medium hover:underline ml-2" href="#">Sign In</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
{% include 'components/footer.html' %}
</body>
  </html>
