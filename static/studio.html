<h1 class="font-headline text-5xl font-light tracking-tight text-on-surface">Atelier Space</h1>
</header>
<div class="flex-1 flex flex-col gap-6">
<label class="text-[0.65rem] uppercase tracking-widest text-stone-400">Composition Buffer</label>
<form action="">
<textarea class="flex-1 bg-transparent border border-primary/40 h-full w-full mt-4 p-4 focus:ring-0 p-0 text-lg md:text-xl font-light leading-relaxed text-on-surface/80 placeholder:text-stone-300 resize-none min-h-[400px]" placeholder="Begin your architectural narrative here..."></textarea>
</div>
<div class="flex gap-8 items-center pt-8 border-t border-outline-variant/10">
<button id="generateBtn" class="px-10 py-4 bg-primary text-on-primary text-[0.7rem] uppercase tracking-[0.3em] font-medium hover:bg-primary/90 transition-all duration-500 shadow-xl shadow-primary/10 active:scale-95">
                            Generate Voice
                        </button>
                    </form>
</div>
</section>
<script>
    document.getElementById("generateBtn").addEventListener("click", async () => {
    const text = document.querySelector("textarea").value;

    if (!text) {
        alert("Please enter text");
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:5000/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
        });

        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);

        // Play audio
        const audio = new Audio(audioUrl);
        audio.play();

    } catch (err) {
        console.error(err);
        alert("Error generating voice");
    }
});

</script>
