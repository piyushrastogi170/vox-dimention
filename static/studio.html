    <script>
function bindControl(rangeId, inputId, labelId, suffix) {
    const range = document.getElementById(rangeId);
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);

    function update(value) {
        range.value = value;
        input.value = value;
        label.textContent = value + suffix;
    }

    range.addEventListener("input", () => {
        update(range.value);
    });

    input.addEventListener("input", () => {
        let val = parseInt(input.value) || 0;

        // clamp value
        val = Math.max(range.min, Math.min(range.max, val));

        update(val);
    });

    update(range.value);
}

// Bind all
bindControl("speed", "speedInput", "speedLabel", "%");
bindControl("pitch", "pitchInput", "pitchLabel", "Hz");
bindControl("volume", "volumeInput", "volumeLabel", "%");
</script>

<script>
/* =============================================
   STUDIO.JS — single, clean, no duplicates
   ============================================= */

// ── Element refs ──────────────────────────────
const audioPlayer   = document.getElementById("audioPlayer");
const previewPlayer = document.getElementById("previewPlayer");
const playBtn       = document.getElementById("playBtn");
const playIcon      = document.getElementById("playIcon");
const progressFill  = document.getElementById("progressFill");
const progressThumb = document.getElementById("progressThumb");
const progressBar   = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl   = document.getElementById("totalTime");
const downloadBtn   = document.getElementById("downloadBtn");
const generateBtn   = document.getElementById("generateBtn");
const genderSel     = document.getElementById("gender");
const countrySel    = document.getElementById("country");
const voiceInput    = document.getElementById("voice");        // hidden input
const voiceList     = document.getElementById("voiceList");    // card container
const selectedLabel = document.getElementById("selectedVoiceLabel");
const speedRange    = document.getElementById("speed");
const pitchRange    = document.getElementById("pitch");
const volumeRange   = document.getElementById("volume");

// State
let currentAudioUrl  = null;   // main player blob URL
let selectedVoiceName = "";    // currently chosen voice ShortName
let previewingVoice   = "";    // voice currently being previewed

// ── Helpers ───────────────────────────────────
function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
}
const buildRate   = v => `${v >= 0 ? "+" : ""}${v}%`;
const buildPitch  = v => `${v >= 0 ? "+" : ""}${v}Hz`;
const buildVolume = v => `${v >= 0 ? "+" : ""}${v}%`;

// ── Slider live labels ────────────────────────
speedRange.addEventListener("input",  () => { document.getElementById("speedLabel").textContent  = buildRate(speedRange.value);   });
pitchRange.addEventListener("input",  () => { document.getElementById("pitchLabel").textContent  = buildPitch(pitchRange.value);  });
volumeRange.addEventListener("input", () => { document.getElementById("volumeLabel").textContent = buildVolume(volumeRange.value); });

// ── Fetch helper: reads response, throws readable error ───────────────────────
async function safeAudioFetch(url, options = {}) {
    const res = await fetch(url, options);
    const ct  = res.headers.get("Content-Type") || "";

    if (!res.ok || !ct.includes("audio")) {
        let msg = `Server ${res.status}`;
        if (ct.includes("application/json")) {
            try { const d = await res.json(); msg = d.error || msg; } catch(_) {}
        } else {
            const html = await res.text();
            console.error("Server error response:", html);
            msg = `Server error ${res.status} — see console for details`;
        }
        throw new Error(msg);
    }
    return res;
}

// ── Build voice card list ─────────────────────
function buildVoiceCards(voices) {
    voiceList.innerHTML = "";

    if (!voices.length) {
        voiceList.innerHTML = '<div class="px-4 py-3 text-sm text-on-surface/40 italic">No voices found for this selection.</div>';
        return;
    }

    voices.forEach((v, idx) => {
        const card = document.createElement("div");
        card.className  = "voice-card flex items-center justify-between px-4 py-3 border-b border-outline-variant/10 last:border-b-0";
        card.dataset.name  = v.name;
        card.dataset.label = v.label;

        card.innerHTML = `
            <div class="flex flex-col gap-0.5 min-w-0 pr-3">
                <span class="text-xs font-medium text-on-surface/80 truncate">${v.label.split("(")[0].trim()}</span>
                <span class="text-[0.6rem] text-on-surface/40 tracking-wide">${v.locale}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button class="preview-btn w-7 h-7 flex items-center justify-center border border-outline-variant/30
                               text-primary hover:bg-primary hover:text-white transition-all duration-300"
                        data-voice="${v.name}" title="Preview voice" aria-label="Preview">
                    <span class="material-symbols-outlined preview-icon" style="font-size:14px;font-variation-settings:'FILL' 1;">play_arrow</span>
                </button>
                <button class="select-btn text-[0.6rem] uppercase tracking-widest px-3 py-1
                               border border-outline-variant/30 text-on-surface/60
                               hover:border-primary hover:text-primary transition-all duration-300"
                        data-voice="${v.name}" data-label="${v.label}">
                    Select
                </button>
            </div>
        `;

        voiceList.appendChild(card);

        // Mark first card as selected by default on first load
        if (idx === 0 && !selectedVoiceName) {
            selectVoice(v.name, v.label, card);
        }
    });

    // Restore previously selected voice if it still exists in new list
    if (selectedVoiceName) {
        const match = voiceList.querySelector(`.voice-card[data-name="${selectedVoiceName}"]`);
        if (match) {
            match.classList.add("selected");
        } else {
            // Previous selection no longer in filtered list — auto-select first
            const first = voiceList.querySelector(".voice-card");
            if (first) selectVoice(first.dataset.name, first.dataset.label, first);
        }
    }
}

// ── Select a voice ────────────────────────────
function selectVoice(name, label, cardEl) {
    selectedVoiceName    = name;
    voiceInput.value     = name;
    const shortLabel     = label.split("(")[0].trim();
    selectedLabel.textContent = shortLabel;

    // Update card highlight
    voiceList.querySelectorAll(".voice-card").forEach(c => c.classList.remove("selected"));
    if (cardEl) cardEl.classList.add("selected");
}

// ── Voice card event delegation ───────────────
voiceList.addEventListener("click", async (e) => {
    // ── Preview button ──
    const previewBtn = e.target.closest(".preview-btn");
    if (previewBtn) {
        const voiceName = previewBtn.dataset.voice;
        const iconEl    = previewBtn.querySelector(".preview-icon");

        // Stop any existing preview
        if (!previewPlayer.paused) {
            previewPlayer.pause();
            previewPlayer.src = "";
        }
        // Restore any spinning icon
        voiceList.querySelectorAll(".preview-icon").forEach(ic => {
            ic.textContent = "play_arrow";
            ic.classList.remove("preview-spin");
        });

        if (previewingVoice === voiceName) {
            // Clicking the same voice again → just stop
            previewingVoice = "";
            return;
        }

        previewingVoice    = voiceName;
        iconEl.textContent = "autorenew";
        iconEl.classList.add("preview-spin");
        previewBtn.disabled = true;

        try {
            const res  = await safeAudioFetch(`/preview?voice=${encodeURIComponent(voiceName)}`);
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);

            previewPlayer.src = url;

            // IMPORTANT: connect BEFORE play
            VIZ.ensureConnected(previewPlayer);

            await previewPlayer.play();
            VIZ.start();

            previewPlayer.onended = () => {
                URL.revokeObjectURL(url);
                previewPlayer.src  = "";
                previewingVoice    = "";

                VIZ.stop(); // 🔥 IMPORTANT

                iconEl.textContent = "play_arrow";
                iconEl.classList.remove("preview-spin");
            };
        } catch (err) {
            console.error("Preview error:", err);
            alert("Preview failed: " + err.message);
            previewingVoice    = "";
            iconEl.textContent = "play_arrow";
            iconEl.classList.remove("preview-spin");
        } finally {
            previewBtn.disabled = false;
            if (previewingVoice === voiceName) {
                iconEl.textContent = "stop";
                iconEl.classList.remove("preview-spin");
            }
        }
        return;
    }

    // ── Select button ──
    const selectBtn = e.target.closest(".select-btn");
    if (selectBtn) {
        const card = selectBtn.closest(".voice-card");
        selectVoice(selectBtn.dataset.voice, selectBtn.dataset.label, card);
        return;
    }
});

// ── Load voices (gender + country) ───────────
async function loadVoices() {
    const gender  = genderSel.value;
    const country = countrySel.value;

    voiceList.innerHTML = '<div class="px-4 py-3 text-sm text-on-surface/40 italic">Loading voices...</div>';

    try {
        const res    = await fetch(`/voices?gender=${encodeURIComponent(gender)}&country=${encodeURIComponent(country)}`);
        const voices = await res.json();
        buildVoiceCards(voices);
    } catch (err) {
        console.error("Voice load error:", err);
        voiceList.innerHTML = '<div class="px-4 py-3 text-sm text-error italic">Error loading voices.</div>';
    }
}

genderSel.addEventListener("change",  loadVoices);
countrySel.addEventListener("change", loadVoices);
loadVoices();

// ── Generate Audio ────────────────────────────
generateBtn.addEventListener("click", async () => {
    const text = document.getElementById("textInput").value.trim();

    if (!text) {
        alert("Please enter some text first.");
        return;
    }
    if (!voiceInput.value) {
        alert("Please select a voice first.");
        return;
    }

    // Stop any preview that is playing
    if (!previewPlayer.paused) {
        previewPlayer.pause();
        previewPlayer.src = "";
        VIZ.stop(); // 🔥 add this
        previewingVoice   = "";
    }

    const voice  = voiceInput.value;
    const rate   = buildRate(speedRange.value);
    const pitch  = buildPitch(pitchRange.value);
    const volume = buildVolume(volumeRange.value);

    generateBtn.textContent = "Generating...";
    generateBtn.disabled    = true;

    try {
        const res = await safeAudioFetch("/generate", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ text, voice, rate, pitch, volume })
        });

        const blob = await res.blob();
        if (blob.size === 0) throw new Error("Received empty audio file");

        if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl  = URL.createObjectURL(blob);

        audioPlayer.src = currentAudioUrl;
        audioPlayer.load();
        downloadBtn.disabled = false;

        audioPlayer.addEventListener("canplay", () => audioPlayer.play(), { once: true });

    } catch (err) {
        console.error("Generate error:", err);
        alert("Error generating voice: " + err.message);
    } finally {
        generateBtn.textContent = "Generate Voice";
        generateBtn.disabled    = false;
    }
});

// ── Main Player: Play/Pause ───────────────────
playBtn.addEventListener("click", () => {
    if (!audioPlayer.src) return;
    audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
});
audioPlayer.addEventListener("play",  () => { playIcon.textContent = "pause"; });
audioPlayer.addEventListener("pause", () => { playIcon.textContent = "play_arrow"; });
audioPlayer.addEventListener("ended", () => {
    playIcon.textContent      = "play_arrow";
    progressFill.style.width  = "0%";
    progressThumb.style.left  = "0%";
    currentTimeEl.textContent = "0:00";
});

// ── Progress bar ──────────────────────────────
audioPlayer.addEventListener("timeupdate", () => {
    if (!audioPlayer.duration) return;
    const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    progressFill.style.width  = `${pct}%`;
    progressThumb.style.left  = `${pct}%`;
    currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
});
audioPlayer.addEventListener("loadedmetadata", () => {
    totalTimeEl.textContent = formatTime(audioPlayer.duration);
});
progressBar.addEventListener("click", (e) => {
    if (!audioPlayer.duration) return;
    const rect = progressBar.getBoundingClientRect();
    audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
});

// ── Rewind / Forward ──────────────────────────
document.getElementById("rewindBtn").addEventListener("click",  () => {
    audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
});
document.getElementById("forwardBtn").addEventListener("click", () => {
    audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 5);
});

// ── Download (manual only) ───────────────────
downloadBtn.addEventListener("click", () => {
    if (!currentAudioUrl) return;
    const a    = document.createElement("a");
    a.href     = currentAudioUrl;
    a.download = `vox-dimension-${Date.now()}.mp3`;
    a.click();
});


// ═══════════════════════════════════════════════════════════════════
//  AUDIO VISUALIZER — Web Audio API + Canvas, premium animation
// ═══════════════════════════════════════════════════════════════════

const VIZ = (() => {
    // ── Canvas setup ──────────────────────────────────────────────
    const canvas  = document.getElementById("waveformCanvas");
    const ctx2d   = canvas.getContext("2d");
    const vizGlow = document.getElementById("vizGlow");

    // ── Primary brand colour (matches Tailwind --primary #735c00) ─
    const COLOR_PRIMARY    = "115,92,0";   // r,g,b — used in rgba()
    const COLOR_PEAK       = "212,175,55"; // #d4af37 peak flash

    // ── Web Audio graph (created once, reused) ────────────────────
    let audioCtx   = null;
    let analyser   = null;
    let sourceNode = null;
    let connected  = false;

    // ── Animation state ───────────────────────────────────────────
    let rafId      = null;          // requestAnimationFrame handle
    let isPlaying  = false;

    // Per-bar smoothed heights (lerp targets)
    let smoothed   = [];            // current display heights  [0..1]
    let peaks      = [];            // peak hold values          [0..1]
    let peakTimers = [];            // frames until peak drops

    // Config — recalculated on resize
    let BAR_COUNT  = 48;
    const BAR_GAP  = 2;            // px between bars
    const MIN_H    = 0.45;         // minimum bar height (3% of canvas)
    const LERP_UP  = 0.35;         // rise speed  (higher = snappier)
    const LERP_DN  = 0.18;         // fall speed  (lower  = smoother tail)
    const PEAK_HOLD= 18;           // frames peak marker stays
    const PEAK_DROP= 0.012;        // peak fall speed per frame

    // Idle breathing — sine wave parameters
    let idleT = 600;

    // ── DPR-aware canvas resize ───────────────────────────────────
    function resizeCanvas() {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx2d.scale(dpr, dpr);

        // Recalculate bar count based on container width (responsive)
        const logicalW = rect.width;
        BAR_COUNT = Math.max(24, Math.min(72, Math.floor(logicalW / 9)));

        // Resize smoothed arrays, preserving existing values
        const prev = smoothed.length;
        smoothed   = Array.from({ length: BAR_COUNT }, function(_, i) { return smoothed[i]   !== undefined ? smoothed[i]   : MIN_H; });
        peaks      = Array.from({ length: BAR_COUNT }, function(_, i) { return peaks[i]      !== undefined ? peaks[i]      : 0; });
        peakTimers = Array.from({ length: BAR_COUNT }, function(_, i) { return peakTimers[i] !== undefined ? peakTimers[i] : 0; });
    }

    // ── Connect an <audio> element to the Web Audio graph ──────────
    // Each HTMLMediaElement may only have ONE MediaElementSource node.
    // We track connected elements to prevent "already connected" errors.
    var connectedElements = [];

    function ensureConnected(mediaEl) {
        // mediaEl defaults to audioPlayer for backward compat
        if (!mediaEl) mediaEl = audioPlayer;

        // First call ever: create the AudioContext + AnalyserNode
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize               = 256;
                analyser.smoothingTimeConstant = 0.75;
                analyser.connect(audioCtx.destination); // analyser → speakers
            } catch (e) {
                console.warn("Web Audio API unavailable:", e);
                return;
            }
        }

        // Resume if suspended (browser autoplay policy)
        if (audioCtx.state === "suspended") audioCtx.resume();

        // Only connect each element once — MediaElementSource is a singleton
        if (connectedElements.indexOf(mediaEl) !== -1) return;

        try {
            var src = audioCtx.createMediaElementSource(mediaEl);
            src.connect(analyser); // tap into the analyser
            connectedElements.push(mediaEl);
            connected = true;
        } catch (e) {
            console.warn("Could not connect media element to Web Audio:", e);
        }
    }

    // ── Map FFT bins → bar index with logarithmic distribution ────
    // Low frequencies get more bars (perceptually accurate, like Spotify)
    function getBinForBar(barIdx, totalBins) {
        // Logarithmic mapping: bar 0 → low freq, bar N → ~6kHz (speech range)
        const minHz = 80;
        const maxHz = 6000;
        const nyq   = audioCtx ? audioCtx.sampleRate / 2 : 24000;
        const minBin = Math.floor(minHz / nyq * totalBins);
        const maxBin = Math.floor(maxHz / nyq * totalBins);
        const t = barIdx / (BAR_COUNT - 1);
        // Logarithmic interpolation
        return Math.floor(minBin * Math.pow(maxBin / minBin, t));
    }

    // ── Build per-bar amplitude from analyser data ─────────────────
    function getBarAmplitudes(dataArray) {
        const totalBins = analyser.frequencyBinCount; // fftSize/2
        const amps = new Float32Array(BAR_COUNT);

        for (let i = 0; i < BAR_COUNT; i++) {
            const bin = getBinForBar(i, totalBins);

            // Smooth sampling (3-bin average)
            const lo = Math.max(0, bin - 1);
            const hi = Math.min(totalBins - 1, bin + 1);

            let sum = 0;
            for (let b = lo; b <= hi; b++) {
                sum += dataArray[b];
            }

            // Normalize (0 → 1)
            let val = sum / ((hi - lo + 1) * 255);

            // 🔥 Adaptive boost for low-volume signals (TTS fix)
            if (val < 0.15) {
                val *= 2.2; // aggressively boost quiet parts
            }

            // 🔥 Gamma curve (makes mid values more visible)
            val = Math.pow(val, 0.65);

            // 🔥 Soft gain (avoid harsh spikes)
            val *= 1.5;

            // 🔥 Clamp (safe upper bound)
            amps[i] = Math.min(1, val);
        }
        return amps;
    }

    // ── Bell-curve weight: center bars taller, edges softer ───────
    function bellWeight(i) {
        const x = (i / (BAR_COUNT - 1)) * 2 - 1; // [-1, 1]
        return 0.25 + 0.75 * Math.exp(-x * x * 3.5); ////////
    }

    // ── Idle breathing sine wave ──────────────────────────────────
    function getIdleHeight(i) {
        const phase  = (i / BAR_COUNT) * Math.PI * 2;
        const wave   = Math.sin(idleT * 0.8 + phase);
        const weight = bellWeight(i);
        return MIN_H + weight * 0.12 * (0.5 + 0.5 * wave); ///////
    }

    // ── Draw a single frame ───────────────────────────────────────
    function drawFrame() {
        const W = canvas.width  / (window.devicePixelRatio || 1);
        const H = canvas.height / (window.devicePixelRatio || 1);

        // Clear
        ctx2d.clearRect(0, 0, W, H);

        const barW    = Math.max(1, (W - (BAR_COUNT - 1) * BAR_GAP) / BAR_COUNT);
        const originY = H;          // bars grow upward from bottom

        for (let i = 0; i < BAR_COUNT; i++) {
            const h = Math.pow(smoothed[i], 1.6) * H * 1.5; ///////////
            const x      = i * (barW + BAR_GAP);
            const y      = originY - h;
            const weight = bellWeight(i);
            const alpha  = 0.5 + 0.5 * weight; // depth effect: center = fully opaque

            // ── Bar gradient (gold bottom → lighter top) ──────────
            const grad = ctx2d.createLinearGradient(0, originY, 0, y);
            grad.addColorStop(0,   `rgba(${COLOR_PRIMARY},${alpha * 0.9})`);
            grad.addColorStop(0.6, `rgba(${COLOR_PRIMARY},${alpha * 0.7})`);
            grad.addColorStop(1,   `rgba(212,175,55,${alpha * 0.5})`);

            ctx2d.fillStyle = grad;
            ctx2d.fillRect(x, y, barW, h);

            // ── Glow overlay (top ~20% of bar) ────────────────────
            if (smoothed[i] > 0.12) {
                const glowH = h * 0.22;
                const glow  = ctx2d.createLinearGradient(0, y, 0, y + glowH);
                glow.addColorStop(0,   `rgba(212,175,55,${0.4 * weight})`);
                glow.addColorStop(1,   `rgba(212,175,55,0)`);
                ctx2d.fillStyle = glow;
                ctx2d.fillRect(x, y, barW, glowH);
            }

            // ── Peak marker ───────────────────────────────────────
            if (peaks[i] > MIN_H + 0.01) {
                const peakY = originY - peaks[i] * H;
                ctx2d.fillStyle = `rgba(${COLOR_PEAK},${0.7 * weight})`;
                ctx2d.fillRect(x, peakY - 1, barW, 2);
            }
        }

        // ── Horizontal floor line ─────────────────────────────────
        ctx2d.fillStyle = `rgba(${COLOR_PRIMARY},0.08)`;
        ctx2d.fillRect(0, originY - 1, W, 1);
    }

    // ── Main animation loop ───────────────────────────────────────
    function loop() {
        rafId = requestAnimationFrame(loop);

        if (( !audioPlayer.paused || !previewPlayer.paused ) && connected && analyser) {
            // Live mode: read real frequency data
            const dataArr = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArr);
            const amps = getBarAmplitudes(dataArr);

            for (let i = 0; i < BAR_COUNT; i++) {
                const weight = 0.6 + 0.4 * bellWeight(i); // less aggressive
                const target = Math.max(MIN_H, amps[i] * weight * 1.4);
                // LERP: rise fast, fall slow
                const speed  = target > smoothed[i] ? LERP_UP : LERP_DN;
                smoothed[i]  = smoothed[i] + (target - smoothed[i]) * speed;

                // Peak hold logic
                if (smoothed[i] >= peaks[i]) {
                    peaks[i]      = smoothed[i];
                    peakTimers[i] = PEAK_HOLD;
                } else {
                    if (peakTimers[i] > 0) {
                        peakTimers[i]--;
                    } else {
                        peaks[i] = Math.max(smoothed[i], peaks[i] - PEAK_DROP);
                    }
                }
            }

            // Suppress glow pulse during playback
            vizGlow.style.opacity = "0";

        } else {
            // Idle / paused mode: gentle breathing
            idleT += 0.03;
            for (let i = 0; i < BAR_COUNT; i++) {
                const target = getIdleHeight(i);
                smoothed[i]  = smoothed[i] + (target - smoothed[i]) * 0.06;
                // Gently drain peaks in idle
                peaks[i]     = Math.max(smoothed[i], peaks[i] - PEAK_DROP * 0.3);
            }
            vizGlow.style.opacity = "1";
        }

        drawFrame();
    }

    // ── Public API ────────────────────────────────────────────────
    function start() {
        // Resume AudioContext if suspended (browser autoplay policy)
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        isPlaying = true;
    }

    function stop() {
        isPlaying = false;
    }

    function init() {
        resizeCanvas();

        // Initialise arrays
        smoothed   = new Array(BAR_COUNT).fill(MIN_H);
        peaks      = new Array(BAR_COUNT).fill(0);
        peakTimers = new Array(BAR_COUNT).fill(0);

        // Start loop immediately (shows idle breathing)
        if (!rafId) loop();

        // Resize handler (debounced)
        let rto;
        window.addEventListener("resize", () => {
            clearTimeout(rto);
            rto = setTimeout(() => {
                ctx2d.resetTransform();
                resizeCanvas();
            }, 120);
        });
    }

    return { init, start, stop, ensureConnected };
})();

// ── Hook VIZ into BOTH audio elements ────────────────────────────────────────

// Initialise on page load (starts idle breathing immediately)
VIZ.init();

// ── Main audioPlayer ─────────────────────────────────────────────────────────
audioPlayer.addEventListener("play", function() {
    VIZ.ensureConnected(audioPlayer);   // connect main player to analyser
    VIZ.start();
});
audioPlayer.addEventListener("pause", function() { VIZ.stop(); });
audioPlayer.addEventListener("ended", function() { VIZ.stop(); });

// ── Preview player — also drives the waveform while previewing ────────────────
previewPlayer.addEventListener("play", function() {
    VIZ.ensureConnected(previewPlayer); // connect preview player to same analyser
    VIZ.start();
});
previewPlayer.addEventListener("pause", function() { VIZ.stop(); });
previewPlayer.addEventListener("ended", function() { VIZ.stop(); });

// ── Word counter (500-word limit) ─────────────────────────────────────────────
var WORD_LIMIT = 500;
var wordBadge  = document.getElementById("wordCountBadge");
var wordBar    = document.getElementById("wordProgressBar");
var textInput  = document.getElementById("textInput");

function countWords(str) {
    var trimmed = str.trim();
    if (!trimmed) return 0;
    return trimmed.split(/\s+/).length;
}

function updateWordCount() {
    var words = countWords(textInput.value);

    // Enforce hard limit: trim to 500 words if exceeded
    if (words > WORD_LIMIT) {
        var parts = textInput.value.trim().split(/\s+/);
        // Rebuild with exactly 500 words, preserving a trailing space if mid-word
        textInput.value = parts.slice(0, WORD_LIMIT).join(" ");
        words = WORD_LIMIT;
    }

    var pct = Math.min(100, (words / WORD_LIMIT) * 100);

    // Badge text
    wordBadge.textContent = words + " / " + WORD_LIMIT;

    // Progress bar fill
    wordBar.style.width = pct + "%";

    // Colour shift: green-ish → amber → error red near limit
    if (pct >= 95) {
        wordBar.style.background = "#ba1a1a";           // error red
        wordBadge.style.color    = "#ba1a1a";
        wordBadge.style.borderColor = "rgba(186,26,26,0.4)";
    } else if (pct >= 80) {
        wordBar.style.background = "#d4af37";           // primary-container gold
        wordBadge.style.color    = "#554300";
        wordBadge.style.borderColor = "";
    } else {
        wordBar.style.background = "#735c00";           // brand primary
        wordBadge.style.color    = "";
        wordBadge.style.borderColor = "";
    }
}

textInput.addEventListener("input", updateWordCount);
updateWordCount(); // initialise on load

// ── Dimension counter (increments each generation) ────────────────────────────
var dimensionCount = 0;
var dimensionEl    = document.getElementById("dimensionTitle");

function incrementDimension() {
    dimensionCount++;
    // Zero-pad to 2 digits: 01, 02, ... 10, 11 ...
    var padded = dimensionCount < 10 ? "0" + dimensionCount : "" + dimensionCount;
    dimensionEl.textContent = "Dimension " + padded;
}

// ── Dynamic audio metadata ─────────────────────────────────────────────────────
var audioMetaEl = document.getElementById("audioMeta");

audioPlayer.addEventListener("loadedmetadata", function() {
    // edge-tts outputs stereo MP3. AudioContext sampleRate gives the actual rate.
    // We read it from the already-created audioCtx if available, else default 48k.
    var sr = (typeof audioCtx !== "undefined" && audioCtx)
             ? audioCtx.sampleRate
             : 48000;
    var khz = Math.round(sr / 1000);
    audioMetaEl.textContent = "STEREO / " + khz + "KHZ";
});

// ── Patch generateBtn listener to also call incrementDimension ────────────────
// We wrap the existing canplay handler that auto-plays after generation.
// The cleanest hook point is right after audioPlayer.load() — we listen for
// loadedmetadata on the player once per generate call.
(function() {
    var origGenerateClick = generateBtn.onclick; // unused — just a safety note

    // Intercept audioPlayer loadedmetadata for dimension bump
    // Use { once: true } each time so it only fires once per generation.
    var _origLoad = audioPlayer.load.bind(audioPlayer);
    audioPlayer.load = function() {
        audioPlayer.addEventListener("loadedmetadata", incrementDimension, { once: true });
        _origLoad();
    };
}());

</script>
